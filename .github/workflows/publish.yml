#  Created: 2026-03-24
#  Last Modified: 2026-10-28
#  Summary: On a push to main, builds dist/ from src/, commits it, builds the help pages from docs/, and deploys the website to GitHub Pages.
#  Notes: See README file for documentation and full license information.
#  Website: https://github.com/DepressionCenter/datalavista
