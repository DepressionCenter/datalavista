name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The full history lets the checks compare a pull request with its target branch
          fetch-depth: 0

      - name: Repository checks
        run: bash tests/check-repository.sh "${{ github.event.pull_request.base.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Unit tests
        run: |
          shopt -s nullglob
          files=(tests/*.test.cjs tests/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No unit test files found in tests/."
            exit 0
          fi
          node --test "${files[@]}"

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache esbuild
        uses: actions/cache@v6
        with:
          path: ~/.cache/datalavista-build
          key: esbuild-0.28.0-linux-x64

      - name: Build
        run: bash build.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Check the built script for syntax errors
        run: node --check datalavista.js

      - name: Install test tools
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: tests
        run: npx playwright test

      - name: Save the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 14
